name: Tracing smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tracing-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm@8

      - name: Install dependencies
        run: pnpm install

      - name: Prepare docker network
        run: |
          docker network create trace-net || true

      - name: Start Tempo (trace store)
        run: |
          docker run -d --rm --name tempo --network trace-net -p 3100:3100 grafana/tempo:latest

      - name: Start OpenTelemetry Collector
        run: |
          docker run -d --rm --name otelcol --network trace-net -p 4318:4318 -v $GITHUB_WORKSPACE/.github/tracing/otel-collector-config.yaml:/etc/otel/config.yaml otel/opentelemetry-collector-contrib:0.86.0 --config /etc/otel/config.yaml

      - name: Start Grafana (with provisioning)
        run: |
          docker run -d --rm --name grafana --network trace-net -p 3000:3000 \
            -v $GITHUB_WORKSPACE/.github/tracing/grafana/provisioning:/etc/grafana/provisioning \
            -v $GITHUB_WORKSPACE/.github/tracing/grafana/dashboards:/var/lib/grafana/dashboards \
            grafana/grafana:latest

      - name: Wait for Grafana
        run: |
          for i in {1..30}; do
            if curl -sS -u admin:admin http://localhost:3000/api/health | grep -q ""; then
              echo "Grafana ready"; break
            fi
            sleep 1
          done

      - name: Create Tempo datasource in Grafana
        run: |
          curl -s -u admin:admin -H "Content-Type: application/json" -X POST http://localhost:3000/api/datasources -d '{"name":"Tempo","type":"tempo","access":"proxy","url":"http://tempo:3100","isDefault":true}'

      - name: Import dashboard into Grafana
        run: |
          curl -s -u admin:admin -H "Content-Type: application/json" -X POST http://localhost:3000/api/dashboards/db -d @.github/tracing/grafana-dashboard.json

      - name: Start backend (tracing enabled, using collector)
        env:
          TRACING_ENABLED: 'true'
          TRACING_OTLP_ENDPOINT: 'http://localhost:4318/v1/traces'
        run: |
          pnpm --filter diagnosticox-backend dev &
          echo "backend started"

      - name: Run tracing smoke test (query Tempo)
        env:
          TRACE_QUERY_API: 'http://localhost:3100'
        run: node ./scripts/tracing-smoke-test.js

      - name: Snapshot grafana dashboard via API
        run: |
          # fetch dashboard object
          curl -s -u admin:admin http://localhost:3000/api/dashboards/uid/diagnosticox-traces -o /tmp/dash.json
          # create snapshot
          SNAP=$(curl -s -u admin:admin -H "Content-Type: application/json" -X POST http://localhost:3000/api/snapshots -d @/tmp/dash.json)
          echo "snapshot response: $SNAP"
          echo "$SNAP" > /tmp/grafana_snapshot_response.json
          if echo "$SNAP" | grep -q "url"; then
            echo "Grafana snapshot created";
          else
            echo "Failed to create Grafana snapshot"; exit 6;
          fi

      - name: Upload Grafana snapshot artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grafana-snapshot
          path: /tmp/grafana_snapshot_response.json

      - name: Render Grafana dashboard PNG
        run: |
          # try rendering the first panel of the dashboard to a PNG (safe-guard with || true)
          curl -s -u admin:admin "http://localhost:3000/render/d-solo/diagnosticox-traces/diagnosticox-traces?panelId=1&width=1200&height=800" -o /tmp/diagnosticox_traces.png || true

      - name: Upload Grafana PNG artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grafana-dashboard-png
          path: /tmp/diagnosticox_traces.png

      - name: Cleanup tracing containers
        if: always()
        run: |
          docker stop otelcol || true
          docker stop tempo || true
          docker stop grafana || true
          docker network rm trace-net || true
