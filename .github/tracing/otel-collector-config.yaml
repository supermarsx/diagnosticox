receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # export to Tempo via OTLP HTTP
  otlp/tempo:
    endpoint: "http://tempo:4318/v1/traces"
    tls:
      insecure: true

  # useful for CI debugging
  logging:
    loglevel: debug

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, logging]
